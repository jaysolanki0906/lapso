<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <div class="row">
    <div class="mb-3 col-md-6">
      <label class="form-label fw-bold">Category <span class="text-danger">*</span></label>
      <select class="form-select"
              [(ngModel)]="product.category"
              name="category"
              required
              (ngModelChange)="onCategoryChange()"
              [disabled]="mode === 'view'">
        <option [ngValue]="null">Select Category</option>
        <option *ngFor="let cat of categories" [ngValue]="cat">{{ cat.title }}</option>
      </select>
      <div class="form-text text-danger" *ngIf="!product.category && f.submitted">Please select Category.</div>
    </div>
    <div class="mb-3 col-md-6">
      <label class="form-label fw-bold">Brands <span class="text-danger">*</span></label>
      <select class="form-select"
              [ngModel]="selectedBrandIds"
              (ngModelChange)="selectedBrandIds = $event"
              name="brand"
              required
              [disabled]="mode === 'view' || !filteredBrands.length">
        <option *ngFor="let brand of filteredBrands" [value]="brand.id">{{ brand.title }}</option>
      </select>
      <div class="form-text text-danger" *ngIf="f.submitted">Please select at least one Brand.</div>
    </div>
  </div>
  <div class="row">
    <div class="mb-3 col-md-6">
      <label class="form-label fw-bold">Product Name <span class="text-danger">*</span></label>
      <input type="text" class="form-control" placeholder="Product Name"
             [(ngModel)]="product.productName" name="productName" required [disabled]="mode === 'view'" #productNameCtrl="ngModel">
             <div *ngIf="productNameCtrl.invalid && (productNameCtrl.touched || f.submitted)" class='text-danger'>
  Product Name is required.
</div>
    </div>
    <div class="mb-3 col-md-6">
      <label class="form-label fw-bold">Product Code</label>
      <input type="text" class="form-control" placeholder="Product Code"
             [(ngModel)]="product.productCode" name="productCode" [disabled]="mode === 'view'">
    </div>
  </div>
  <div class="row">
    <div class="mb-3 col-md-6">
      <label class="form-label fw-bold">Model Number</label>
      <input type="text" class="form-control" placeholder="Model Number"
             [(ngModel)]="product.modelNumber" name="modelNumber" [disabled]="mode === 'view'">
    </div>
    <div class="mb-3 col-md-6">
      <label class="form-label fw-bold">Product Description</label>
      <textarea class="form-control" rows="2" placeholder="Product Description"
                [(ngModel)]="product.description" name="description" [disabled]="mode === 'view'"></textarea>
    </div>
  </div>
  <div class="row align-items-end">
    <div class="col-6 mb-3">
      <div class="form-check mb-1">
        <input class="form-check-input"
               type="checkbox"
               [(ngModel)]="product.hasWarranty"
               name="hasWarranty"
               id="hasWarranty"
               [disabled]="mode === 'view'"
               (change)="markWarrantyTouched()">
        <label class="form-check-label" for="hasWarranty">Default Warranty</label>
      </div>
      <div class="input-group">
        <select class="form-select"
                [(ngModel)]="product.warrantyUnit"
                name="warrantyUnit"
                [disabled]="!product.hasWarranty || mode === 'view'"
                (blur)="markWarrantyTouched()"
                (change)="markWarrantyTouched()">
          <option value="DAYS">Days</option>
          <option value="MONTHS">Months</option>
          <option value="YEARS">Years</option>
        </select>
        <input type="number"
               class="form-control"
               placeholder="Enter Warranty"
               [(ngModel)]="product.warranty"
               name="warranty"
               [disabled]="!product.hasWarranty || mode === 'view'"
               (blur)="markWarrantyTouched()"
               (input)="markWarrantyTouched()">
      </div>
      <div *ngIf="product.hasWarranty && (!product.warrantyUnit || !product.warranty || product.warranty < 1) && warrantyTouched" class="form-text text-danger">
        <ng-container *ngIf="!product.warranty || product.warranty < 1">Please enter Warranty value.</ng-container>
      </div>
    </div>
    <div class="col-6 mb-3">
      <div class="form-check mb-1">
        <input class="form-check-input"
               type="checkbox"
               [(ngModel)]="product.hasGuarantee"
               name="hasGuarantee"
               id="hasGuarantee"
               [disabled]="mode === 'view'"
               (change)="markGuaranteeTouched()">
        <label class="form-check-label" for="hasGuarantee">Default Guarantee</label>
      </div>
      <div class="input-group">
        <select class="form-select"
                [(ngModel)]="product.guaranteeUnit"
                name="guaranteeUnit"
                [disabled]="!product.hasGuarantee || mode === 'view'"
                (blur)="markGuaranteeTouched()"
                (change)="markGuaranteeTouched()">
          <option value="DAYS">Days</option>
          <option value="MONTHS">Months</option>
          <option value="YEARS">Years</option>
        </select>
        <input type="number"
               class="form-control"
               placeholder="Enter Guarantee"
               [(ngModel)]="product.guarantee"
               name="guarantee"
               [disabled]="!product.hasGuarantee || mode === 'view'"
               (blur)="markGuaranteeTouched()"
               (input)="markGuaranteeTouched()">
      </div>
      <div *ngIf="product.hasGuarantee && (!product.guaranteeUnit || !product.guarantee || product.guarantee < 1) && guaranteeTouched" class="form-text text-danger">
        <ng-container *ngIf="!product.guarantee || product.guarantee < 1">Please enter Guarantee value.</ng-container>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-6 mb-3">
      <label class="form-label fw-bold">Price</label>
      <input type="number" class="form-control" placeholder="Price"
             [(ngModel)]="product.price" name="price" [disabled]="mode === 'view'">
    </div>
    <div class="col-6 mb-3">
      <label class="form-label fw-bold">Tax (in %)</label>
      <select class="form-select"
              [(ngModel)]="product.tax"
              name="taxSelect"
              [disabled]="mode === 'view'">
        <option value="">Select Tax</option>
        <option value="1.00">GST 1%</option>
        <option value="5.00">GST 5%</option>
        <option value="6.00">GST 6%</option>
      </select>
    </div>
  </div>
  <div class="mt-3 text-end">
    <button *ngIf="mode !== 'view'" type="submit" class="btn btn-danger px-4" [disabled]="submitting">
      {{ mode === 'edit' ? 'Update Product' : 'Save Product' }}
    </button>
    <button *ngIf="mode === 'view'" type="button" class="btn btn-secondary px-4" disabled>
      View Only
    </button>
  </div>
</form>
