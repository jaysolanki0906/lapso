<app-header></app-header>
<div class="main-layout">
  <app-sidebar></app-sidebar>
  <div class="main-content">
  
<div class="main-content">
  <div class="products-list-header">
    <div>
      <div class="products-list-title">Sales Voucher List</div>
      <div class="products-list-sub">Manage your Sale Vouchers</div>
    </div>
    <button
      class="add-product-btn"
      type="button"
      (click)="onAddProduct()"
      *ngIf="canCreate"
    >
      <span class="add-product-icon-circle">
        <mat-icon class="add-product-plus">add</mat-icon>
      </span>
      Add Invoice
    </button>
  </div>

  <app-common-table-card
    [searchFields]="searchFields"
    [columns]="columns"
    [showToggle]="false"
    [data]="filteredData"
    [total]="total"
    [page]="page"
    [pageSize]="pageSize"
    (pageChange)="onPageChange($event)"
    (search)="onSearch($event)"
    (clear)="onClear()"
    [callbtn]="false"
    (edit)="onEdit($event)"
    (view)="onView($event)"
    (delete)="onDelete($event)"
    (sort)="onSort($event)"
     [canEdit]="canEdit"
  [canView]="canView"
  [canDelete]="canDelete" 
  [enableSorting]="true"
    
  ></app-common-table-card>
</div>
</div>
</div>
